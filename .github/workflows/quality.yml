name: Wagaku quality

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wagaku-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-and-build:
    name: Unit, lint, and build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Generate Prisma client
        run: npx prisma generate
      - name: Run unit tests
        run: npm test
      - name: Run lint
        run: npm run lint
      - name: Build application
        env:
          DATABASE_URL: file:/tmp/wagaku-ci.db
        run: npm run build

  reviews-performance:
    name: Reviews accessibility and performance
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Generate Prisma client
        run: npx prisma generate
      - name: Install Chromium and system dependencies
        run: npx playwright install --with-deps chromium
      - name: Select Playwright Chromium
        shell: bash
        run: echo "PLAYWRIGHT_EXECUTABLE_PATH=$(find \"$HOME/.cache/ms-playwright\" -type f -path '*/chrome-linux/chrome' | head -1)" >> "$GITHUB_ENV"
      - name: Run focused reviews performance check
        run: npm run test:reviews:perf
      - name: Upload performance artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reviews-performance-${{ github.run_id }}
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 14

  reviews-e2e:
    name: Reviews full E2E flow
    runs-on: ubuntu-latest
    needs: reviews-performance
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Generate Prisma client
        run: npx prisma generate
      - name: Install Chromium and system dependencies
        run: npx playwright install --with-deps chromium
      - name: Select Playwright Chromium
        shell: bash
        run: echo "PLAYWRIGHT_EXECUTABLE_PATH=$(find \"$HOME/.cache/ms-playwright\" -type f -path '*/chrome-linux/chrome' | head -1)" >> "$GITHUB_ENV"
      - name: Run review-page E2E suite
        run: npm run test:e2e
      - name: Upload E2E artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reviews-e2e-${{ github.run_id }}
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 14

  daily-ingestion-accuracy:
    name: Daily JLPT ingestion accuracy
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Generate Prisma client
        run: npx prisma generate
      - name: Install OCR dependencies
        run: sudo apt-get update -qq && sudo apt-get install -y -qq tesseract-ocr tesseract-ocr-jpn poppler-utils
      - name: Run PDF extraction and fuzzy-match accuracy harness
        run: npm run test:ingestion:accuracy
      - name: Upload accuracy report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ingestion-accuracy-${{ github.run_id }}
          path: artifacts/ingestion-accuracy.json
          if-no-files-found: warn
          retention-days: 30
